name: Weekly digest email

# The only recurring email OppIDX sends: the top 10 opportunities of the
# past 7 days, ranked by real view count, to every subscriber who hasn't
# unsubscribed or been auto-suppressed for a bounce/complaint. Idempotent
# per calendar date, so a manual re-run the same day is a no-op. See
# app/api/cron/weekly-digest-email/route.ts.
on:
  schedule:
    - cron: '30 3 * * 1' # 03:30 UTC Monday = 09:00 IST — start of the week
  workflow_dispatch: {}

jobs:
  weekly-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest email
        run: |
          curl -sf -X GET "https://www.oppidx.com/api/cron/weekly-digest-email" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
