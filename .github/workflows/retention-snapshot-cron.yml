name: Weekly retention snapshot

# Durable weekly record of the Gate-0 retention numbers (does anyone come
# back?) — see app/api/cron/retention-snapshot/route.ts. Idempotent per
# ISO week, so a manual re-run the same week is a no-op.
on:
  schedule:
    - cron: '0 3 * * 1' # 03:00 UTC Monday = 08:30 IST — start of the week
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger retention snapshot
        run: |
          curl -sf -X GET "https://www.oppidx.com/api/cron/retention-snapshot" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
