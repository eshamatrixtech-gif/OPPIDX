name: Policy digest

# Generates the daily policy-actions digest (and the weekly roundup too,
# on Sundays — see app/api/cron/policy-digest/route.ts) and posts the
# shareable link to Telegram/Discord.
on:
  schedule:
    - cron: '30 15 * * *' # 15:30 UTC = 21:00 IST daily — after the day's news has settled
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger policy digest
        run: |
          curl -sf -X GET "https://www.oppidx.com/api/cron/policy-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
